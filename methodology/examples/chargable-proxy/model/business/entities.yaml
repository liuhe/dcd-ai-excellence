entity:
  - id: ent-001
    name: Account
    summary: >
      Each account represents one proxy user. Created either manually by admin or automatically when a Taobao order is
      fulfilled.
    fields:
      - id: Long, auto-increment primary key
      - username: String, unique, used as HTTP proxy username
      - password: String, used as HTTP proxy password
      - status: AccountStatus(Active/Disabled), account state
      - createdAt: LocalDateTime, creation time
      - updatedAt: LocalDateTime, last update time
    state_machine:
      field: status
      states:
        - Active
        - Disabled
      transitions:
        - from: Active
          to: Disabled
          trigger: Admin manually disables (e.g., abuse, refund)
        - from: Disabled
          to: Active
          trigger: Admin re-enables
    rules:
      - id: rule-001
        content: Username must be unique across all accounts
        field: username
      - id: rule-002
        content: Password should be generated randomly with sufficient entropy (at least 12 characters)
        field: password
  - id: ent-002
    name: Package
    summary: >
      A package grants an account a certain amount of proxy traffic for a limited time. Multiple packages can be bound
      to one account; the proxy uses the first active one. proxyTierId determines which speed tier this package uses
      (e.g., high-speed vs ultra-speed). accessScope controls what traffic is routed: 'nintendo' for Nintendo CDN only,
      'freedom' for all.
    fields:
      - id: Long, auto-increment primary key
      - accountId: Long, references Account
      - name: String, display name (e.g., '50GB Monthly')
      - proxyTierId: Long, references ProxyTier, determines which speed tier / proxy node serves this package
      - accessScope: "String, traffic routing scope: 'nintendo' = Nintendo CDN only, 'freedom' = all traffic"
      - quotaBytes: Long, traffic quota in bytes
      - usedBytes: Long, traffic consumed in bytes, default 0
      - activatedAt: LocalDateTime, when the package was activated
      - expiresAt: LocalDateTime, expiration time
      - status: PackageStatus(Pending/Active/Expired/Exhausted), package state
      - createdAt: LocalDateTime, creation time
    state_machine:
      field: status
      states:
        - Pending
        - Active
        - Expired
        - Exhausted
      transitions:
        - from: Pending
          to: Active
          trigger: Redemption code is redeemed, or admin manually activates
        - from: Active
          to: Exhausted
          trigger: usedBytes >= quotaBytes
        - from: Active
          to: Expired
          trigger: Current time exceeds expiresAt
      summary: >
        Expired is computed at query time based on expiresAt, not persisted via a cron job. When proxy checks validity,
        it evaluates both usedBytes and expiresAt in real time.
    relationships:
      - kind: associates
        target: ent-001
        cardinality: many-to-one
        via: accountId
        note: An account can have multiple packages (current + future)
      - kind: associates
        target: ent-006
        cardinality: many-to-one
        via: proxyTierId
        note: Which speed tier this package uses
    rules:
      - id: rule-003
        content: >-
          Only one package per account should be Active at a time; others remain Pending until the current one is
          exhausted or expired
        related_use_cases:
          - auc-019
      - id: rule-004
        content: >-
          When an active package is exhausted or expired, the next Pending package (by createdAt order) is automatically
          activated
        related_use_cases:
          - auc-019
  - id: ent-003
    name: RedemptionCode
    summary: >
      Redemption codes are generated in batch by admin, then delivered to buyers via Taobao. When redeemed, the system
      creates a Package based on the referenced PackageTemplate.
    fields:
      - id: Long, auto-increment primary key
      - code: String, unique, the redemption code string
      - packageTemplateId: Long, references PackageTemplate, determines what Package to create on redemption
      - status: CodeStatus(Available/Redeemed/Disabled), code state
      - packageId: Long, references Package, nullable; the package created when this code was redeemed
      - redeemedAt: LocalDateTime, when the code was redeemed, nullable
      - createdAt: LocalDateTime, creation time
    state_machine:
      field: status
      states:
        - Available
        - Redeemed
        - Disabled
      transitions:
        - from: Available
          to: Redeemed
          trigger: Player redeems the code for their account
        - from: Available
          to: Disabled
          trigger: Admin disables unused code (e.g., refund scenario)
    relationships:
      - kind: associates
        target: ent-002
        cardinality: one-to-one
        via: packageId
        note: The package created when this code was redeemed; nullable until redemption
      - kind: associates
        target: ent-007
        cardinality: many-to-one
        via: packageTemplateId
        note: Determines what Package to create when the code is redeemed
    rules:
      - id: rule-005
        content: Code string must be unique and hard to guess (e.g., UUID-based or random alphanumeric)
        field: code
      - id: rule-006
        content: A code can only be redeemed once; concurrent redemption attempts must be handled atomically
        related_use_cases:
          - auc-009
  - id: ent-004
    name: UsageLog
    summary: >
      Records individual proxy request traffic for auditing and analytics. The auth-proxy reports usage in batches to
      manager-server for efficiency.
    fields:
      - id: Long, auto-increment primary key
      - accountId: Long, references Account
      - packageId: Long, references Package
      - bytesTransferred: Long, bytes transferred in this request
      - requestHost: String, target host of the proxied request
      - loggedAt: LocalDateTime, timestamp
    relationships:
      - kind: associates
        target: ent-002
        cardinality: many-to-one
        via: packageId
  - id: ent-005
    name: TaobaoOrder
    summary: >
      Tracks each Taobao trade and its mapping to local account/package. Used for reconciliation, refund handling, and
      troubleshooting.
    fields:
      - id: Long, auto-increment primary key
      - taobaoTradeId: String, unique, Taobao trade ID (tid)
      - taobaoOrderId: String, Taobao sub-order ID (oid), nullable for single-item orders
      - skuId: String, Taobao SKU ID
      - buyerNick: String, buyer's Taobao nickname
      - accountId: Long, references Account, nullable until fulfilled
      - redemptionCodeId: Long, references RedemptionCode, nullable
      - status: TaobaoOrderStatus(Received/Fulfilled/DeliveryFailed/Refunded), order processing state
      - paidAt: LocalDateTime, when the buyer paid
      - fulfilledAt: LocalDateTime, when auto-fulfillment completed, nullable
      - failReason: String, reason for delivery failure, nullable
      - retryCount: Integer, number of delivery retries, default 0
      - createdAt: LocalDateTime, creation time
    state_machine:
      field: status
      states:
        - Received
        - Fulfilled
        - DeliveryFailed
        - Refunded
      transitions:
        - from: Received
          to: Fulfilled
          trigger: Account + package created and credentials delivered to buyer via Taobao API
        - from: Received
          to: DeliveryFailed
          trigger: Taobao delivery API call failed (will retry)
        - from: DeliveryFailed
          to: Fulfilled
          trigger: Retry succeeds
        - from: DeliveryFailed
          to: DeliveryFailed
          trigger: Retry fails again (increment retryCount)
        - from: Fulfilled
          to: Refunded
          trigger: Taobao refund notification received; account and package disabled
    relationships:
      - kind: associates
        target: ent-001
        cardinality: many-to-one
        via: accountId
        note: Links the Taobao order to the provisioned proxy account
      - kind: associates
        target: ent-003
        cardinality: one-to-one
        via: redemptionCodeId
        note: Optional — redemption code generated for the buyer to use for renewals
      - kind: associates
        target: ent-008
        cardinality: many-to-one
        via: skuId
        note: Records which SKU was ordered, used to look up package spec during fulfillment
    rules:
      - id: rule-007
        content: >-
          Processing must be idempotent — receiving the same taobaoTradeId multiple times must not create duplicate
          accounts
        field: taobaoTradeId
        related_use_cases:
          - auc-005
      - id: rule-008
        content: When retryCount exceeds 3, stop retrying and alert admin
        field: retryCount
        related_use_cases:
          - auc-006
  - id: ent-006
    name: ProxyTier
    summary: >
      Represents a speed tier of the proxy service, each backed by a distinct proxy node. Admin manages tiers
      independently. Current tiers: - 高速版 (hs): ~30Mbps, endpoint hs01.example.com:3128 - 极速版 (xs): ~200Mbps, endpoint
      xs01.example.com:3129
    fields:
      - id: Long, auto-increment primary key
      - name: String, display name (e.g., '高速版', '极速版')
      - endpoint: String, proxy address in host:port format (e.g., 'hs01.example.com:3128')
      - bandwidthMbps: Integer, theoretical bandwidth in Mbps (e.g., 30, 200)
      - active: Boolean, whether this tier is available, default true
  - id: ent-007
    name: PackageTemplate
    summary: >
      Defines the specification for a class of packages. Both TaobaoSku and RedemptionCode reference a PackageTemplate
      to determine what Package to create upon fulfillment. Admin manages templates independently; multiple SKUs or code
      batches can share one template.
    fields:
      - id: Long, auto-increment primary key
      - name: String, display name for packages created from this template (e.g., 'DLC3 高速版 3GB/30d')
      - quotaBytes: Long, traffic quota in bytes
      - validityDays: Integer, package validity in days
      - proxyTierId: Long, references ProxyTier, determines which speed tier the created package uses
      - accessScope: "String, traffic routing scope: 'nintendo' = Nintendo CDN only, 'freedom' = all traffic, default 'nintendo'"
      - active: Boolean, whether this template is available for use, default true
    relationships:
      - kind: associates
        target: ent-006
        cardinality: many-to-one
        via: proxyTierId
        note: Which speed tier packages created from this template will use
  - id: ent-008
    name: TaobaoSku
    summary: >
      Maps a Taobao shop SKU to a PackageTemplate and fulfillment behavior. Each Taobao SKU is a combination of two
      dimensions (5 × 2 = 10 SKUs per product): (1) traffic tier (游戏版本) → quotaBytes + validityDays in the template (2)
      speed tier (语种分类) → proxyTierId in the template:
          英语=高速版(hs, ~30Mbps), 简体中文=极速版(xs, ~200Mbps)
      fulfillmentType determines what AutoFulfillOrder creates: - NewAccount: create Account + Package + RedemptionCode
      (【新账号】product) - RedemptionOnly: create only a RedemptionCode (【流量包】product, buyer redeems it for their existing
      account)
    fields:
      - id: Long, auto-increment primary key
      - skuId: String, unique, Taobao SKU ID
      - skuName: String, human-readable SKU label shown on Taobao (e.g., 'DLC拓展3 高速版')
      - packageTemplateId: Long, references PackageTemplate
      - fulfillmentType: FulfillmentType(NewAccount/RedemptionOnly), determines what to create on fulfillment
      - active: Boolean, whether this SKU mapping is active, default true
    relationships:
      - kind: associates
        target: ent-007
        cardinality: many-to-one
        via: packageTemplateId
        note: Resolves Taobao SKU to the package specification to create
    rules:
      - id: rule-009
        content: Each Taobao SKU ID must map to exactly one PackageTemplate
        field: skuId
      - id: rule-010
        content: >-
          Admin must configure SKU mappings before auto-fulfillment can work; orders with unmapped SKUs are flagged as
          DeliveryFailed
        related_use_cases:
          - auc-006
