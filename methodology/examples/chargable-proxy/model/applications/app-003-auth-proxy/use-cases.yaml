app-use-case:
  - id: auc-019
    name: AuthenticateAndForward
    actor: pt-002
    includes:
      - auc-011
      - auc-012
      - auc-020
    rules:
      - id: rule-053
        content: >-
          Intercept incoming HTTP CONNECT/GET requests from Switch Console. Extract username and password from HTTP
          Basic Auth header (Proxy-Authorization).
      - id: rule-054
        content: >-
          Validate credentials against the LOCAL IN-MEMORY account table (populated via SyncAccountData at startup and
          refreshed every 30s). No real-time call to manager-server on the request path. If invalid, return HTTP 407.
      - id: rule-055
        content: "Check the local package data: is there an active, non-expired, non-exhausted package? If not, reject with 407."
      - id: rule-056
        content: If valid, forward the request to Squid (upstream proxy) for actual proxying.
      - id: rule-057
        content: >-
          After the response is returned, calculate bytes transferred and increment usedBytes in the local in-memory
          copy. Buffer usage records and report to manager-server.ReportUsage in batches (every 30 seconds or every 100
          records).
      - id: rule-058
        content: >-
          If manager-server is unreachable, auth-proxy continues operating normally using cached data. Usage records are
          buffered locally and flushed when manager-server becomes available again.
