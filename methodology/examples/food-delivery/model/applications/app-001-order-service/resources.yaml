resource:
  - id: res-001
    name: POST /api/orders
    type: api
    spec: "body: { restaurantId, lines[{menuItemId, quantity}], deliveryAddress }"
  - id: res-002
    name: POST /api/payments/callback
    type: api
    spec: 支付机构回调，签名在 header
  - id: res-003
    name: POST /api/orders/{id}/cancel
    type: api
  - id: res-004
    name: GET /api/orders/{id}
    type: api
    spec: 返回订单、支付、配送状态与骑手位置
  - id: res-005
    name: POST /api/orders/{id}/accept
    type: api
  - id: res-006
    name: POST /api/orders/{id}/ready
    type: api
  - id: res-007
    name: PUT /api/restaurants/{id}/menu
    type: api
  - id: res-008
    name: POST /api/deliveries/{id}/progress
    type: api
    spec: "body: { stage: PickedUp | Delivered }"
  - id: res-009
    name: POST /api/refunds
    type: api
  - id: res-010
    name: POST /api/refunds/{id}/review
    type: api
    spec: "body: { approve: boolean, reason? }"
  - id: res-011
    name: order.events
    type: topic
    spec: key = orderId；事件类型 OrderPaid / OrderAccepted / OrderReady / OrderDelivered
    store: ds-003
  - id: res-012
    name: t_order
    type: table
    spec: 订单主表，订单行在 t_order_line
    store: ds-001
  - id: res-013
    name: t_payment
    type: table
    store: ds-001
  - id: res-014
    name: order:{id}:status
    type: cache-key
    spec: 订单状态快照，TTL 1 小时
    store: ds-002
